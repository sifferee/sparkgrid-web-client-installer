<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkGrid — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0f;--card:#12121a;--card2:#0f0f17;--border:#1e1e2e;--border2:#2a2a3a;--txt:#e4e4ed;--txt2:#8b8b9f;--txt3:#5a5a6e;--accent:#6c5ce7;--green:#00b894;--red:#ff6b6b;--blue:#0984e3;--orange:#e17055;--pink:#fd79a8;--yellow:#fdcb6e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* Header */
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:11px;color:var(--txt3)}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn-sm{background:var(--card);border:1px solid var(--border2);color:var(--txt);padding:6px 14px;border-radius:8px;font-size:12px;transition:.15s}
.btn-sm:hover{border-color:var(--accent);background:rgba(108,92,231,.1)}
.btn-prim{background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px}
.btn-prim:hover{opacity:.85}
.btn-warn{background:var(--orange);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px}

.wrap{max-width:1500px;margin:0 auto;padding:16px}

/* KPI Row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--pink),var(--blue))}
.kpi .lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin:4px 0;line-height:1}
.kpi .dlt{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.dlt.up{color:var(--green)}.dlt.down{color:var(--red)}.dlt.flat{color:var(--txt3)}

/* Accounts Table */
.sec{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.sec-hdr h2{font-size:14px;font-weight:600}
.sec-hdr .cnt{font-size:11px;color:var(--txt3)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.r{text-align:right}
.tbl td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td.r{text-align:right}
.tbl tr{transition:.1s;cursor:pointer}
.tbl tr:hover td{background:rgba(108,92,231,.06)}
.tbl tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.new{background:var(--orange)}
.acc-name{font-weight:600}
.stat-val{font-weight:600;font-size:13px}
.delta{font-size:11px;font-weight:600}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--txt3)}
.spark{width:60px;height:20px;display:inline-block;vertical-align:middle}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:20px;width:90%;max-width:750px;max-height:80vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-hdr h2{font-size:18px;font-weight:700}
.modal-x{background:none;border:none;color:var(--txt3);font-size:22px}
.chart-box{height:220px;margin-bottom:12px;position:relative}
.chart-box h3{font-size:11px;color:var(--txt3);text-transform:uppercase;margin-bottom:4px}

/* Config */
.cfg{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.cfg h3{font-size:12px;color:var(--txt2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.cfg-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.cfg-row label{font-size:12px;min-width:130px;color:var(--txt2)}
.cfg-row input{flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:7px 10px;border-radius:8px;font-size:12px}
.cfg-row button{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:12px}

.empty{padding:40px;text-align:center;color:var(--txt3);font-size:13px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.tbl{font-size:11px}.tbl th,.tbl td{padding:6px 8px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <span class="hdr-logo">📊 SparkGrid</span>
    <span class="hdr-sub">Metrics Dashboard</span>
  </div>
  <div class="hdr-r">
    <a href="/" class="btn-sm">← Back</a>
    <button class="btn-sm" onclick="loadData()">Refresh</button>
    <button class="btn-warn" onclick="runCheck()">Check Now</button>
  </div>
</div>

<div class="wrap">
  <!-- Config -->
  <div class="cfg" id="cfgBox" style="display:none">
    <h3>⚙️ Ads Power Config</h3>
    <div class="cfg-row"><label>Parser Profile IDs:</label><input id="cfgProfiles" placeholder="id1,id2"></div>
    <div class="cfg-row"><label>API URL:</label><input id="cfgUrl" value="http://local.adspower.net:50325"></div>
    <div class="cfg-row"><label>API Key:</label><input id="cfgKey" type="password"></div>
    <div class="cfg-row"><label></label><button onclick="saveCfg()">Save</button></div>
  </div>

  <!-- KPIs -->
  <div class="kpi-row" id="kpis"><div class="empty">Loading...</div></div>

  <!-- Accounts -->
  <div class="sec">
    <div class="sec-hdr">
      <h2>Account Metrics</h2>
      <span class="cnt" id="accCount"></span>
    </div>
    <table class="tbl" id="tbl">
      <thead><tr>
        <th></th><th>Account</th><th class="r">Followers</th><th class="r">Views</th>
        <th class="r">Likes</th><th class="r">Comments</th><th class="r">Posts</th>
        <th class="r">Reels</th><th>Last Check</th><th></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hdr"><h2 id="mTitle"></h2><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="chart-box"><h3>Followers</h3><canvas id="cFollowers"></canvas></div>
    <div class="chart-box"><h3>Views</h3><canvas id="cViews"></canvas></div>
    <div class="chart-box"><h3>Likes</h3><canvas id="cLikes"></canvas></div>
  </div>
</div>

<script>
let CH={};
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n}
function dlt(d){if(d>0)return'+'+fmt(d);if(d<0)return fmt(d);return'0'}
function dc(d){return d>0?'up':d<0?'down':'flat'}

async function loadData(){
  try{
    const r=await fetch('/api/ig-web-upload/metrics/overview?hours=24');
    const d=await r.json();
    if(!d.ok){document.getElementById('kpis').innerHTML='<div class="empty">No data yet. Click "Check Now".</div>';document.getElementById('tb').innerHTML='';return}

    // KPIs
    const t=d.total,dl=d.delta_24h;
    const kpis=[
      {l:'Followers',v:t.followers,d:dl.followers,c:'#6c5ce7'},
      {l:'Views',v:t.views,d:dl.views,c:'#0984e3'},
      {l:'Likes',v:t.likes,d:dl.likes,c:'#00b894'},
      {l:'Comments',v:t.comments,d:dl.comments,c:'#fdcb6e'},
    ];
    document.getElementById('kpis').innerHTML=kpis.map(k=>`
      <div class="kpi">
        <div class="lbl">${k.l}</div>
        <div class="val" style="color:${k.c}">${fmt(k.v)}</div>
        <div class="dlt ${dc(k.d)}">${k.d>0?'▲':k.d<0?'▼':'●'} ${dlt(k.d)} (24h)</div>
      </div>`).join('');

    // Accounts table
    const accs=d.accounts||[];
    document.getElementById('accCount').textContent=accs.length+' accounts';
    document.getElementById('tb').innerHTML=accs.map(a=>{
      const dl=a.delta||{};
      const st=a.error?'err':'ok';
      const err=a.error?`<span style="font-size:10px;color:var(--red)">⚠ ${a.error.slice(0,30)}</span>`:'';
      const fid=a.name.replace(/[^a-zA-Z0-9]/g,'');
      return `<tr onclick="openModal('${a.name}')">
        <td><span class="dot ${st}"></span></td>
        <td><span class="acc-name">${a.name}</span><br>${err}</td>
        <td class="r"><span class="stat-val">${fmt(a.followers)}</span><br><span class="delta ${dc(dl.followers||0)}">${dlt(dl.followers||0)}</span></td>
        <td class="r"><span class="stat-val">${fmt(a.total_views)}</span><br><span class="delta ${dc(dl.views||0)}">${dlt(dl.views||0)}</span></td>
        <td class="r"><span class="stat-val">${fmt(a.total_likes)}</span><br><span class="delta ${dc(dl.likes||0)}">${dlt(dl.likes||0)}</span></td>
        <td class="r">${fmt(a.total_comments)}</td>
        <td class="r">${fmt(a.posts_count)}</td>
        <td class="r" style="color:var(--orange)">${a.active_stories_count||0}</td>
        <td style="font-size:10px;color:var(--txt3)">${a.checked_at?a.checked_at.slice(11,16):'—'}</td>
        <td><canvas class="spark" id="s${fid}" width="60" height="20"></canvas></td>
      </tr>`;
    }).join('');

    // Draw sparklines
    for(const a of accs){drawSpark(a.name)}
  }catch(e){document.getElementById('kpis').innerHTML='<div class="empty">Error: '+e.message+'</div>'}
}

async function drawSpark(name){
  try{
    const r=await fetch(`/api/ig-web-upload/metrics/${name}?hours=168`);
    const d=await r.json();
    if(!d.ok||!d.history||d.history.length<2)return;
    const fid='s'+name.replace(/[^a-zA-Z0-9]/g,'');
    const cv=document.getElementById(fid);
    if(!cv)return;
    new Chart(cv,{type:'line',data:{labels:d.history.map(h=>h.checked_at.slice(11,16)),datasets:[{data:d.history.map(h=>h.followers||0),borderColor:'#6c5ce7',borderWidth:1,fill:false,pointRadius:0,tension:.3}]},options:{responsive:false,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},animation:false,height:20}})
  }catch(e){}
}

async function openModal(name){
  document.getElementById('mTitle').textContent='@'+name;
  document.getElementById('modalBg').classList.add('on');
  Object.values(CH).forEach(c=>c.destroy());CH={};
  try{
    const r=await fetch(`/api/ig-web-upload/metrics/${name}?hours=168`);
    const d=await r.json();
    if(!d.ok||!d.history||d.history.length<2)return;
    const lb=d.history.map(h=>h.checked_at.slice(5,16));
    CH.f=new Chart(document.getElementById('cFollowers'),{type:'line',data:{labels:lb,datasets:[{data:d.history.map(h=>h.followers||0),borderColor:'#6c5ce7',backgroundColor:'rgba(108,92,231,.08)',fill:true,tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})
    CH.v=new Chart(document.getElementById('cViews'),{type:'line',data:{labels:lb,datasets:[{data:d.history.map(h=>h.total_views||0),borderColor:'#0984e3',backgroundColor:'rgba(9,132,227,.08)',fill:true,tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})
    CH.l=new Chart(document.getElementById('cLikes'),{type:'line',data:{labels:lb,datasets:[{data:d.history.map(h=>h.total_likes||0),borderColor:'#00b894',backgroundColor:'rgba(0,184,148,.08)',fill:true,tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})
  }catch(e){}
}

function closeModal(e){if(e&&e.target!==document.getElementById('modalBg')&&e.type==='click')return;document.getElementById('modalBg').classList.remove('on');Object.values(CH).forEach(c=>c.destroy());CH={}}

async function runCheck(){try{await fetch('/api/ig-web-upload/metrics/run',{method:'POST'});setTimeout(loadData,90000)}catch(e){}}

// Show config if no data
async function checkCfg(){
  try{
    const r=await fetch('/api/ig-web-upload/metrics/overview');
    const d=await r.json();
    if(!d.ok||!d.accounts||d.accounts.length===0){document.getElementById('cfgBox').style.display='block'}
  }catch(e){}
}

loadData();checkCfg();
setInterval(loadData,300000);
</script>
</body>
</html>
